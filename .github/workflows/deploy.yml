name: CI/CD Production Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:


permissions:
  contents: read
  id-token: write

jobs:
  test-and-lint:
    name: Run Unit Tests & Build Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Unit Tests
        run: |
          python -m unittest discover -s backend/tests

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: |
          npm ci

      - name: Check Frontend Build Compilation
        working-directory: ./frontend
        run: |
          npm run build

  deploy-production:
    name: Deploy to Google Cloud Run
    needs: test-and-lint
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (Keyless WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/686815886180/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-deployer@bd-to-dd.iam.gserviceaccount.com'

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend to Cloud Run Production
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUD_SQL_INSTANCE: "bd-to-dd:asia-southeast1:bd-to-dd"
          GCS_BUCKET_NAME: "bd-to-dd-assets"
        run: |
          if [ -d "./INPUT" ]; then
            rm -rf ./backend/INPUT
            cp -r ./INPUT ./backend/INPUT
          fi

          gcloud run deploy bd-to-dd-backend-prod \
            --quiet \
            --source ./backend \
            --region asia-east1 \
            --allow-unauthenticated \
            --no-cpu-throttling \
            --memory 2Gi \
            --cpu 2 \
            --min-instances 1 \
            --max-instances 10 \
            --add-cloudsql-instances=bd-to-dd:asia-southeast1:bd-to-dd \
            --set-env-vars "GEMINI_API_KEY=${GEMINI_API_KEY},GEMINI_LLM_API_KEY=${GEMINI_API_KEY},GEMINI_EMBEDDING_API_KEY=${GEMINI_API_KEY},DATABASE_URL=${DATABASE_URL},QDRANT_URL=${QDRANT_URL},QDRANT_API_KEY=${QDRANT_API_KEY},GCS_BUCKET_NAME=${GCS_BUCKET_NAME},TMP_DIR=/tmp,ARTIFACTS_DIR=/tmp/artifacts,BM25_INDEX_PATH=/tmp/bm25_index.json"

      - name: Deploy Frontend to Cloud Run Production
        run: |
          BACKEND_URL=$(gcloud run services describe bd-to-dd-backend-prod --region asia-east1 --format 'value(status.url)')
          gcloud run deploy bd-to-dd-frontend-prod \
            --quiet \
            --source ./frontend \
            --region asia-east1 \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 1 \
            --max-instances 10 \
            --set-env-vars "NEXT_PUBLIC_API_BASE_URL=${BACKEND_URL}/api/v1"

